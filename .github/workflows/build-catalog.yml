# Keeps dmb-1.7.json, the launcher's mod list, current without anyone curating it by hand: every day,
# and whenever an entry changes, VCMI's official index and DMB's entries are merged again. A pull
# request that adds or changes an entry is checked the same way before it can be merged.
name: Build the catalog

on:
  schedule:
    - cron: "17 6 * * *"
  push:
    branches: [main]
    paths: ["entries/**", "tools/**", ".github/workflows/build-catalog.yml"]
  pull_request:
    paths: ["entries/**", "tools/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check the entries and the merge
        if: github.event_name == 'pull_request'
        run: python3 tools/build_catalog.py --check

      - name: Merge VCMI's index with DMB's entries
        if: github.event_name != 'pull_request'
        run: python3 tools/build_catalog.py

      - name: Commit the list if it changed
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- dmb-1.7.json; then
            echo "The list is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dmb-1.7.json
          git commit -m "The catalog, merged again from VCMI's index and DMB's entries"
          git push
